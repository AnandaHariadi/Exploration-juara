<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <!-- Red Crimson Gradient for Emblem -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Deep Metallic Carbon Gradient -->
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Chrome Sheen Gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Red Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <g transform="translate(40, 30)">
    <!-- 4-Pillar Interlocking Geometric Emblem (Contract, RAB, Progress, Invoice) -->
    <g filter="url(#subtleGlow)">
      <!-- Left Anchor: Contract & Baseline Block -->
      <path d="M 30 15 L 85 15 C 105 15 120 30 120 50 L 120 70 L 65 70 C 45 70 30 55 30 35 Z" fill="url(#carbonGrad)" />
      
      <!-- Top Arc: Intelligent Multi-dimensional Loop -->
      <path d="M 65 15 L 140 15 C 160 15 175 30 175 50 L 175 130 C 175 150 160 165 140 165 L 65 165 C 45 165 30 150 30 130 L 30 110 L 65 110 C 75 110 82 117 82 127 C 82 133 87 138 93 138 L 135 138 C 145 138 152 130 152 120 L 152 60 C 152 50 145 42 135 42 L 65 42 Z" fill="url(#crimsonGrad)" />

      <!-- Center Prismatic Fold (Living Reconciliation Pivot) -->
      <path d="M 80 55 L 115 55 L 95 125 L 60 125 Z" fill="#F87171" opacity="0.9" />

      <!-- High Precision Specular Accent -->
      <path d="M 65 15 L 140 15 C 160 15 175 30 175 50 L 175 56 C 175 36 160 21 140 21 L 65 21 Z" fill="#FFFFFF" opacity="0.4" />
    </g>

    <!-- Corporate Typography: CLARA -->
    <g transform="translate(205, 125)">
      <!-- C -->
      <path d="M 52 -6 C 52 -13 46 -18 38 -18 C 16 -18 0 0 0 35 C 0 70 16 88 38 88 C 46 88 52 83 52 76 L 52 65 C 52 61 48 58 44 58 C 40 59 36 60 32 60 C 20 60 14 49 14 35 C 14 21 20 10 32 10 C 36 10 40 11 44 12 C 48 12 52 9 52 5 Z" fill="#09090B" />

      <!-- L -->
      <path d="M 68 -10 C 68 -15 72 -18 76 -18 L 86 -18 C 91 -18 94 -15 94 -10 L 94 72 L 132 72 C 137 72 140 75 140 80 L 140 82 C 140 87 137 90 132 90 L 76 90 C 72 90 68 86 68 82 Z" fill="#09090B" />

      <!-- A -->
      <path d="M 182 -18 L 196 -18 C 200 -18 204 -15 206 -10 L 238 82 C 240 87 236 90 231 90 L 219 90 C 215 90 212 87 210 83 L 202 59 L 175 59 L 167 83 C 166 87 162 90 158 90 L 146 90 C 141 90 138 86 140 82 L 172 -10 C 174 -15 178 -18 182 -18 Z M 180 37 L 198 37 L 189 -6 Z" fill="#09090B" />

      <!-- R -->
      <path d="M 252 -10 C 252 -15 256 -18 260 -18 L 296 -18 C 316 -18 328 -7 328 14 C 328 29 320 38 306 43 L 327 82 C 329 86 326 90 321 90 L 308 90 C 304 90 301 88 299 84 L 280 48 L 278 48 L 278 82 C 278 86 274 90 270 90 L 260 90 C 256 90 252 86 252 82 Z M 278 30 L 294 30 C 304 30 310 25 310 14 C 310 4 304 -1 294 -1 L 278 -1 Z" fill="#09090B" />

      <!-- A -->
      <path d="M 372 -18 L 386 -18 C 390 -18 394 -15 396 -10 L 428 82 C 430 87 426 90 421 90 L 409 90 C 405 90 402 87 400 83 L 392 59 L 365 59 L 357 83 C 356 87 352 90 348 90 L 336 90 C 331 90 328 86 330 82 L 362 -10 C 364 -15 368 -18 372 -18 Z M 370 37 L 388 37 L 379 -6 Z" fill="#DC2626" />
    </g>

    <!-- Tagline: CONTRACT INTELLIGENCE -->
    <g transform="translate(208, 160)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#71717A">
        CONTRACT INTELLIGENCE
      </text>
    </g>
  </g>
</svg>
