<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <!-- Executive Red Gradient -->
    <linearGradient id="claraRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="80%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Beveled Light Overlay for 3D Volume -->
    <linearGradient id="claraBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#450A0A" stop-opacity="0.45" />
    </linearGradient>

    <!-- Drop Shadow for Corporate Elevation -->
    <filter id="claraShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#991B1B" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#claraShadow)">
    <!-- Base Solid Bold Letters with Crisp Corporate Typographic Kerning -->
    <text 
      x="50%" 
      y="160" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="160" 
      font-weight="900" 
      letter-spacing="0.08em"
      fill="url(#claraRedGrad)"
    >CLARA</text>

    <!-- 3D Bevel Highlight & Shadow Layer -->
    <text 
      x="50%" 
      y="160" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="160" 
      font-weight="900" 
      letter-spacing="0.08em"
      fill="url(#claraBevel)"
    >CLARA</text>
  </g>

  <!-- Architectural Horizon Curve / Lekukan Underline Accent -->
  <path d="M 120 182 C 260 200, 540 200, 680 182 C 540 194, 260 194, 120 182 Z" fill="url(#claraRedGrad)" opacity="0.9" />
  <circle cx="120" cy="182" r="3.5" fill="#EF4444" />
  <circle cx="680" cy="182" r="3.5" fill="#DC2626" />
</svg>
