<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 1000" fill="none">
  <defs>
    <!-- Right Ambient Radiance -->
    <radialGradient id="ambGlowR" cx="70%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Upward Soaring Fin Gradient -->
    <linearGradient id="frontRibbonR" x1="85%" y1="100%" x2="15%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="25%" stop-color="#991B1B" />
      <stop offset="55%" stop-color="#DC2626" />
      <stop offset="85%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#FCA5A5" />
    </linearGradient>

    <!-- 3D Architectural Twist Cavity (Shadow Tone) -->
    <linearGradient id="underFoldR" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#450A0A" />
      <stop offset="50%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Ascending Companion Wave -->
    <linearGradient id="echoRibbonR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0" />
      <stop offset="30%" stop-color="#DC2626" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#EF4444" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.45" />
    </linearGradient>

    <!-- Specular Highlight Spine -->
    <linearGradient id="crestHighlightR" x1="90%" y1="100%" x2="10%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0" />
      <stop offset="40%" stop-color="#F87171" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#FECACA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>

    <filter id="monumentShadowR" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="16" stdDeviation="22" flood-color="#7F1D1D" flood-opacity="0.26" />
    </filter>
    <filter id="softGlowR" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Layer 0: Ambient Radiance Aura -->
  <circle cx="380" cy="520" r="320" fill="url(#ambGlowR)" filter="url(#softGlowR)" />

  <!-- Layer 1: Ascending Translucent Echo Wing (Dynamic Asymmetry) -->
  <path d="M 610 920 
           C 440 810, 240 650, 310 410 
           C 360 210, 560 130, 520 40 
           C 430 30, 210 160, 160 390 
           C 110 630, 320 810, 530 960 Z" 
        fill="url(#echoRibbonR)" />

  <!-- Layer 2: 3D Underbelly Cavity (Twist Shadow) -->
  <path d="M 370 570 
           C 290 490, 280 370, 380 270 
           C 440 210, 530 170, 500 90 
           C 470 80, 390 130, 320 220 
           C 240 330, 235 460, 325 565 Z" 
        fill="url(#underFoldR)" />

  <!-- Layer 3: Main Upward Soaring 3D Momentum Ribbon -->
  <path d="M 550 930 
           C 400 810, 270 670, 320 490 
           C 360 370, 480 310, 470 170 
           C 460 70, 370 50, 300 80 
           C 370 150, 410 230, 350 360 
           C 280 510, 210 680, 450 910 
           C 490 950, 540 940, 550 930 Z" 
        fill="url(#frontRibbonR)" 
        filter="url(#monumentShadowR)" />

  <!-- Layer 4: Specular Crest Highlight Line -->
  <path d="M 535 915 
           C 395 805, 275 675, 325 495 
           C 365 375, 475 315, 465 180 
           C 455 105, 400 70, 345 70" 
        stroke="url(#crestHighlightR)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Layer 5: Precision High-Tech Acceleration Strata -->
  <path d="M 505 870 
           C 370 770, 255 645, 295 490 
           C 330 360, 435 290, 425 170 
           C 420 120, 380 90, 340 90" 
        stroke="#FFFFFF" 
        stroke-opacity="0.35" 
        stroke-width="1.8" 
        stroke-dasharray="6 8" 
        stroke-linecap="round" />

  <path d="M 580 840 
           C 470 750, 360 630, 395 490 
           C 430 360, 520 300, 510 200" 
        stroke="#FFFFFF" 
        stroke-opacity="0.22" 
        stroke-width="1.2" 
        stroke-dasharray="3 5" />

  <!-- Layer 6: Velocity Trajectory Nodes -->
  <circle cx="325" cy="495" r="4.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="325" cy="495" r="9" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" />

  <circle cx="465" cy="180" r="3.5" fill="#FFFFFF" fill-opacity="0.75" />
  <circle cx="465" cy="180" r="7" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
</svg>
