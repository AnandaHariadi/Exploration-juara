<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 850" fill="none">
  <defs>
    <linearGradient id="baseGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#DC2626" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#B91C1C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F87171" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="transGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#991B1B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="12" stdDeviation="16" flood-color="#991B1B" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 1. Ambient Under-wing -->
  <path d="M 50 80 C 160 160, 240 300, 180 480 C 120 650, 30 730, 70 810 C 140 820, 220 740, 260 610 C 300 440, 220 240, 100 80 Z" fill="url(#transGrad)" />

  <!-- 2. Main Solid 3D Flow Ribbon -->
  <path d="M 70 110 C 165 190, 225 315, 175 475 C 125 615, 45 690, 80 770 C 125 780, 190 720, 225 610 C 260 475, 200 290, 120 110 Z" fill="url(#baseGrad)" filter="url(#softShadow)" />

  <!-- 3. Luminous Edge Spine -->
  <path d="M 70 110 C 165 190, 225 315, 175 475 C 125 615, 45 690, 80 770" stroke="url(#glowGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- 4. Micro-dot Financial Stream Accent -->
  <path d="M 105 140 C 180 210, 210 320, 170 465 C 135 570, 75 635, 100 730" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round" />
</svg>